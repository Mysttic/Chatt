name: chatt
description: "Komunikator P2P w sieci lokalnej — wiadomości i pliki bez serwera."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true

  # Tłumaczenia generują się z lib/l10n/*.arb przy każdym buildzie.
  generate: true

  # Czcionki dołączone do aplikacji: identyczny rendering na każdej platformie
  # (desktop Linux w kontenerze testowym nie ma czcionek systemowych) oraz
  # poprawne ikony/teksty w testach golden.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf
