syntax = "proto3";

package greet;

message Greeting {
	string nickname = 1;
	string welcome_message = 2;
	string address = 3;
}

message GreetingRequest{
	Greeting greeting = 1;
}

message GreetingResponse {
	string result = 1;
}

service GreetingService {
	//Unary
	rpc Greet (GreetingRequest) returns (GreetingResponse) {}
}