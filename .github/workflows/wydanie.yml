name: Wydanie

# Wydanie powstaje, gdy PR z develop do master zostanie scalony, ale tylko
# wtedy, gdy w scalanych zmianach był VERSION.md. Scalenie samej poprawki do
# kodu czy dokumentacji nie uruchamia więc niczego.
#
# Druga bramka jest w jobie `wersja`: jeśli tag o tej wersji już istnieje,
# bieg kończy się bez robienia niczego. Chroni to przed powtórnym wydaniem,
# gdy ktoś ruszy w VERSION.md sam opis, nie zmieniając numeru.
#
# Pliki nie przechodzą przez artefakty Actions. Te mają wspólny limit miejsca
# dla całego konta i po jego przekroczeniu `upload-artifact` odmawia, a bieg
# z gotowym APK i instalatorem kończy się niczym. Zamiast tego job `wersja`
# zakłada szkic wydania, każdy build wrzuca swój plik prosto do niego
# (`gh release upload`), a job `wydanie` publikuje szkic, gdy są wszystkie
# trzy. Szkic jest niewidoczny dla ludzi i dla aktualizacji w aplikacji, tag
# powstaje dopiero przy publikacji, więc nieudany bieg niczego nie wystawia.
#
# Ta zasada obowiązuje w całym repozytorium: żaden workflow nie woła
# `upload-artifact`, więc ARTEFAKTY biegów w ogóle się nie zbierają. Do tego
# samego limitu miejsca liczą się jednak nadal archiwa logów każdego biegu.
# Nie kasuje ich już żaden przebieg cykliczny - zostają na domyślnej
# 90-dniowej retencji GitHuba, a doraźnie czyści się je ręcznie (Actions,
# wybrany bieg, Delete logs) albo przez
# `gh api -X DELETE repos/:owner/:repo/actions/runs/<id>/logs`.
# Cache zależności (Flutter, Gradle) zostaje - to on ratuje minuty, a GitHub
# zarządza nim sam: kasuje wpisy nieużywane przez 7 dni i wypycha najstarsze
# po przekroczeniu 10 GB.
on:
  push:
    branches: [master]
    paths:
      - VERSION.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wydanie
  cancel-in-progress: false

jobs:
  wersja:
    name: Numer wersji
    runs-on: ubuntu-latest
    # Bezpiecznik, nie oszczędność: job czyta plik i woła API GitHuba, realnie
    # trwa minutę. Bez tego wpisu obowiązuje domyślny limit 6 godzin, więc
    # pojedyncze zawieszone wywołanie sieciowe spaliłoby 360 minut z limitu.
    timeout-minutes: 10
    outputs:
      wersja: ${{ steps.odczyt.outputs.wersja }}
      tag: ${{ steps.odczyt.outputs.tag }}
      wydajemy: ${{ steps.odczyt.outputs.wydajemy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: odczyt
        name: Wersja z VERSION.md
        run: |
          set -euo pipefail
          # Pierwsza linia, która jest samym numerem, reszta pliku to opis.
          wersja=$(grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION.md || true)
          if [ -z "$wersja" ]; then
            echo "::error file=VERSION.md::Nie znalazłem numeru wersji (oczekiwany format: 1.2.3)"
            exit 1
          fi

          # pubspec.yaml musi mówić to samo, bo stamtąd biorą się versionName
          # i versionCode Androida. Rozjazd znaczy, że ktoś podniósł numer
          # tylko w jednym miejscu.
          pelna=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/^version:[[:space:]]*//')
          if [ "${pelna%%+*}" != "$wersja" ]; then
            echo "::error::VERSION.md mówi $wersja, a app/pubspec.yaml $pelna."
            echo "::error::Podnieś oba naraz: cd app && python tool/wersja.py $wersja"
            exit 1
          fi

          tag="v$wersja"
          echo "wersja=$wersja" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag już istnieje, nie wydajemy drugi raz." >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wydanie $tag" >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=true" >> "$GITHUB_OUTPUT"
          fi

      # Szkic po nieudanym biegu zostaje bez tagu, więc bramka wyżej go nie
      # widzi. Nowy bieg kasuje takie szkice i zakłada świeży, żeby pliki
      # z poprzedniej próby nie mieszały się z nowymi.
      - name: Szkic wydania
        if: steps.odczyt.outputs.wydajemy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.odczyt.outputs.tag }}
          WERSJA: ${{ steps.odczyt.outputs.wersja }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.draft and .tag_name == \"$TAG\") | .id" \
            | while read -r stary; do
                echo "Kasuję stary szkic $stary"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$stary"
              done
          gh release create "$TAG" \
            --draft \
            --title "Chatt $WERSJA" \
            --generate-notes \
            --target "$GITHUB_SHA"

  android:
    name: APK (podpisany)
    needs: wersja
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # `cache: gradle` trzyma ~/.gradle/caches i ~/.gradle/wrapper między
      # biegami, kluczując je plikami gradle z repozytorium (app/android).
      # Bez tego cały graf zależności Androida leci od zera przy każdym
      # wydaniu. Checkout jest krok wyżej, więc pliki do klucza już są.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # Bez klucza powstałby APK podpisany kluczem debug (tak działa awaryjna
      # ścieżka w build.gradle.kts), a taki nie ma prawa trafić do wydania,
      # więc lepiej zatrzymać się tutaj z czytelnym komunikatem.
      - name: Klucz do podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] \
             || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Brak sekretów do podpisania APK. Ustaw w repozytorium:"
            echo "::error::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (patrz docs/building.md)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/chatt-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Podpis się zgadza
        run: |
          set -euo pipefail
          narzedzia=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$narzedzia/apksigner" verify --print-certs \
            app/build/app/outputs/flutter-apk/app-release.apk

      - name: Sprzątanie klucza
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/chatt-release.jks"

      # Prosto do szkicu wydania, pod nazwą z numerem wersji: tę nazwę czyta
      # skrypt strony i aktualizacja w samej aplikacji.
      - name: Do wydania
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wersja.outputs.tag }}
          WERSJA: ${{ needs.wersja.outputs.wersja }}
        run: |
          set -euo pipefail
          plik="chatt-$WERSJA-android.apk"
          mv app/build/app/outputs/flutter-apk/app-release.apk "$plik"
          gh release upload "$TAG" "$plik" --clobber

  windows:
    name: Windows
    needs: wersja
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      # Brak runtime'u MSVC widać dopiero na cudzym komputerze: aplikacja nie
      # pokazuje okna i nie zostawia śladu w dzienniku zdarzeń. Tutaj widać go
      # od razu, więc taka paczka nie ma prawa wyjść.
      - name: Runtime MSVC jest w paczce
        shell: pwsh
        run: |
          $katalog = 'app/build/windows/x64/runner/Release'
          $wymagane = 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'
          $brakuje = $wymagane | Where-Object { -not (Test-Path (Join-Path $katalog $_)) }
          if ($brakuje) { throw "Brak w katalogu Release: $($brakuje -join ', ')" }
          Get-ChildItem $katalog -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Spakuj
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath chatt-windows.zip

      # Instalator obok wersji przenośnej: skrót w menu Start, odinstalowanie
      # z ustawień systemu i jedno miejsce na aktualizację. Inno Setup jest
      # na obrazie windows-latest; gdyby zniknął, doinstalowujemy go.
      - name: Instalator
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Nie ma ISCC.exe pod $iscc" }
          & $iscc "/DWersja=${{ needs.wersja.outputs.wersja }}" `
            app\windows\installer\chatt.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup zwrocil $LASTEXITCODE" }
          Get-ChildItem dist

      # Aplikacja na Windows to nie sam exe: potrzebne są jeszcze biblioteki
      # i katalog data obok niego, więc do wydania idzie cały katalog Release
      # w zipie, obok instalatora. Instalator nazywa się już z numerem wersji
      # (nadaje go Inno Setup), zip dostaje go tutaj.
      - name: Do wydania
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wersja.outputs.tag }}
          WERSJA: ${{ needs.wersja.outputs.wersja }}
        run: |
          $zip = "chatt-${env:WERSJA}-windows.zip"
          $instalator = "chatt-${env:WERSJA}-windows-instalator.exe"
          Move-Item chatt-windows.zip $zip
          Move-Item "dist/chatt-${env:WERSJA}-instalator.exe" $instalator
          gh release upload $env:TAG $zip $instalator --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload zwrocil $LASTEXITCODE" }

  wydanie:
    name: Wydanie na GitHubie
    needs: [wersja, android, windows]
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    # Dwa wywołania `gh`, kilkanaście sekund. Limit wyłącznie po to, żeby
    # zawieszone wywołanie nie stało domyślnych 6 godzin.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.wersja.outputs.tag }}
    # Bez checkoutu: wszystko, co tu potrzebne, leży już w szkicu wydania.
    steps:
      # Instalator, wersja przenośna i APK. Mniejsza liczba znaczy, że któryś
      # build nie dowiózł pliku, a wydanie bez kompletu nie ma prawa wyjść.
      - name: Trzy pliki w szkicu
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets -q '.assets[].name' | tee pliki.txt
          if [ "$(wc -l < pliki.txt)" -ne 3 ]; then
            echo "::error::Spodziewałem się trzech plików w szkicu $TAG."
            exit 1
          fi

      # Publikacja zakłada tag i pokazuje wydanie ludziom oraz aktualizacji
      # w aplikacji.
      - name: Publikacja
        run: gh release edit "$TAG" --draft=false

  # Te same trzy pliki idą jeszcze raz do repozytorium z witryną, bo stamtąd
  # pobierają je ludzie: https://mysttic.github.io/Mysttic/chatt/. Strona czyta
  # wydania przez API i sama się wypełnia, więc kopia wystarczy do jej
  # odświeżenia.
  #
  # Tag ma przedrostek `chatt-v`, bo w tym repozytorium leżą wydania wszystkich
  # projektów naraz. Nazwy plików zostają takie same jak tutaj: czyta je skrypt
  # strony i aktualizacja w samej aplikacji.
  witryna:
    name: Kopia na stronę
    needs: [wersja, wydanie]
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    # Pobranie trzech plików i wydanie ich w drugim repozytorium; zapas większy
    # niż wyżej, bo tu idzie transfer instalatora. Znowu tylko bezpiecznik
    # przeciw domyślnym 6 godzinom.
    timeout-minutes: 15
    env:
      HUB: Mysttic/Mysttic
      STRONA: https://mysttic.github.io/Mysttic/chatt/
      WERSJA: ${{ needs.wersja.outputs.wersja }}
      TAG: ${{ needs.wersja.outputs.tag }}
      TAG_HUB: chatt-v${{ needs.wersja.outputs.wersja }}
    steps:
      # Domyślny GITHUB_TOKEN sięga wyłącznie do tego repozytorium, więc kopia
      # potrzebuje własnego poświadczenia. Szczegóły w docs/building.md.
      - name: Poświadczenie do repozytorium z witryną
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HUB_TOKEN:-}" ]; then
            echo "::error::Brak sekretu HUB_TOKEN. Wydanie $TAG powstało, kopia na stronę nie."
            echo "::error::Potrzebny token osobisty z uprawnieniem Contents: read and write do $HUB."
            exit 1
          fi

      - name: Pliki z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p kopia
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir kopia --pattern 'chatt-*'
          ls -la kopia
          # Instalator, wersja przenośna i APK. Mniejsza liczba znaczy, że
          # wydanie wyszło niekompletne i kopiowanie nie ma sensu.
          if [ "$(ls -1 kopia | wc -l)" -ne 3 ]; then
            echo "::error::Spodziewałem się trzech plików w wydaniu $TAG."
            exit 1
          fi

      # Opis zostaje przy numerze i adresie strony. Kod leży w prywatnym
      # repozytorium, więc odnośniki do niego byłyby dla czytelnika ślepe,
      # a opis wydania widać też na karcie aktualizacji w samej aplikacji.
      - name: Opis wydania
        run: |
          set -euo pipefail
          {
            echo "Chatt $WERSJA"
            echo
            echo "$STRONA"
          } > opis.md
          cat opis.md

      - name: Wydanie na stronie
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          # Powtórzony bieg ma zastąpić poprzednią kopię, więc najpierw znika ta
          # o tym samym numerze.
          if gh release view "$TAG_HUB" --repo "$HUB" >/dev/null 2>&1; then
            gh release delete "$TAG_HUB" --repo "$HUB" --cleanup-tag --yes
          fi
          gh release create "$TAG_HUB" kopia/* \
            --repo "$HUB" \
            --title "Chatt $WERSJA" \
            --notes-file opis.md \
            --target master

      # Na stronie stoi jedna wersja, najnowsza. Starsze zostają w tym
      # repozytorium, pod pełną historią wydań. Kasujemy razem z tagiem, żeby
      # nie zbierały się puste znaczniki, i wyłącznie z przedrostkiem `chatt-v`,
      # żeby wydania pozostałych projektów zostały nietknięte.
      - name: Strona trzyma jedną wersję
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$HUB" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -E '^chatt-v' || true; } \
            | { grep -vxF "$TAG_HUB" || true; } \
            | while read -r stary; do
                echo "Kasuję $stary"
                gh release delete "$stary" --repo "$HUB" --cleanup-tag --yes
              done
          echo "Na stronie zostaje $TAG_HUB" >> "$GITHUB_STEP_SUMMARY"
