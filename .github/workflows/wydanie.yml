name: Wydanie

# Wydanie powstaje, gdy PR z develop do master zostanie scalony — czyli przy
# pchnięciu na master. Numer wersji bierzemy z app/pubspec.yaml; jeśli tag
# o tej wersji już istnieje, cały bieg kończy się bez robienia niczego.
# Dzięki temu wydanie robi się samo przez podbicie wersji w pubspec.yaml.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wydanie
  cancel-in-progress: false

jobs:
  wersja:
    name: Numer wersji
    runs-on: ubuntu-latest
    outputs:
      wersja: ${{ steps.odczyt.outputs.wersja }}
      tag: ${{ steps.odczyt.outputs.tag }}
      wydajemy: ${{ steps.odczyt.outputs.wydajemy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: odczyt
        name: Wersja z pubspec.yaml
        run: |
          set -euo pipefail
          pelna=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/^version:[[:space:]]*//')
          wersja=${pelna%%+*}
          tag="v$wersja"
          echo "wersja=$wersja" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag już istnieje — nie wydajemy drugi raz." >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wydanie $tag" >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: APK (podpisany)
    needs: wersja
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # Bez klucza powstałby APK podpisany kluczem debug (tak działa awaryjna
      # ścieżka w build.gradle.kts) — a taki nie ma prawa trafić do wydania,
      # więc lepiej zatrzymać się tutaj z czytelnym komunikatem.
      - name: Klucz do podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] \
             || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Brak sekretów do podpisania APK. Ustaw w repozytorium:"
            echo "::error::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (patrz docs/budowanie.md)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/chatt-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Podpis się zgadza
        run: |
          set -euo pipefail
          narzedzia=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$narzedzia/apksigner" verify --print-certs \
            app/build/app/outputs/flutter-apk/app-release.apk

      - name: Sprzątanie klucza
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/chatt-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows
    needs: wersja
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      # Aplikacja na Windows to nie sam exe: potrzebne są jeszcze biblioteki
      # i katalog data obok niego, więc pakujemy cały katalog Release.
      - name: Spakuj
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath chatt-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: chatt-windows.zip
          if-no-files-found: error

  wydanie:
    name: Wydanie na GitHubie
    needs: [wersja, android, windows]
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: pliki

      - name: Nazwy z numerem wersji
        env:
          WERSJA: ${{ needs.wersja.outputs.wersja }}
        run: |
          set -euo pipefail
          mkdir -p wydanie
          mv pliki/android/app-release.apk "wydanie/chatt-$WERSJA-android.apk"
          mv pliki/windows/chatt-windows.zip "wydanie/chatt-$WERSJA-windows.zip"
          ls -la wydanie

      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wersja.outputs.tag }}
          WERSJA: ${{ needs.wersja.outputs.wersja }}
        run: |
          set -euo pipefail
          gh release create "$TAG" wydanie/* \
            --title "Chatt $WERSJA" \
            --generate-notes \
            --target "$GITHUB_SHA"
