name: Testy

# Bramka przed wpuszczeniem zmian do master: analiza statyczna i cały zestaw
# testów. Odpala się **wyłącznie** przy pull requeście do master, zwykłe
# pchnięcia na develop i gałęzie robocze nie uruchamiają niczego.
#
# Sam blok `on:` umie zawęzić tylko gałąź docelową; zawężenie do PR-ów **z
# develop** siedzi w warunku `if:` przy jobie niżej - razem z opisem tego, co
# się dzieje z PR-em otwartym z innej gałęzi.
#
# Domyślne `types` (opened, reopened, synchronize) zostawiamy świadomie:
# dopóki PR jest otwarty, dorzucone do niego commity przechodzą testy jeszcze
# raz. Bez tego dałoby się scalić PR na podstawie wyniku sprzed poprawek.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Bieg tylko czyta kod, więc token dostaje tyle i nic więcej. W publicznym
# repozytorium ten workflow odpala się na kodzie z cudzych forków, a domyślne
# uprawnienia tokenu bywają szersze, niż potrzeba.
permissions:
  contents: read

# Kolejny commit w otwartym PR anuluje poprzedni, jeszcze trwający bieg.
# Grupa po `github.workflow`, a nie po wpisanej z palca nazwie: ten sam wzorzec
# kopiuje się wtedy do pozostałych repozytoriów bez poprawiania w nim niczego.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: analyze i flutter test
    # `on: pull_request: branches:` filtruje wyłącznie gałąź DOCELOWĄ (master).
    # GitHub nie umie filtrować po gałęzi źródłowej w bloku `on:`, więc źródło
    # sprawdzamy dopiero tutaj: testy biegną tylko dla PR-a z develop.
    #
    # Świadoma konsekwencja tej decyzji: PR do master otwarty z innej gałęzi niż
    # develop (np. hotfix prosto z gałęzi roboczej) nie uruchomi żadnego joba,
    # a GitHub pokaże taki bieg jako ZIELONY - pominięty job liczy się jako
    # sukces. Nie ma tu joba-zaślepki, który zamieniałby to w czerwony wynik.
    # Zmiany do master mają iść przez develop; hotfix prosto do master trzeba
    # przetestować ręcznie albo odpalić ten workflow z `workflow_dispatch`.
    #
    # `github.head_ref` jest puste dla `workflow_dispatch`, dlatego ręczne
    # uruchomienie przepuszczamy osobnym członem warunku.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Wersja przypięta na sztywno: przypadkowa aktualizacja Fluttera nie
          # ma prawa wywrócić buildu. Podbijamy ją świadomie, razem z lokalnym
          # SDK (patrz docs/building.md).
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Zależności
        run: flutter pub get

      - name: Analiza statyczna
        run: flutter analyze

      # Testy podnoszą po dwie pełne instancje aplikacji w jednym procesie
      # i każą im rozmawiać po prawdziwym gnieździe TCP, a discovery działa
      # na rozgłoszeniach UDP, dlatego biegną na maszynie, a nie w atrapach.
      - name: Testy
        run: flutter test --reporter expanded
